<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One For All</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#6b6b76;--card:#f2f2f5;--line:#e4e4ea;--acc:#0057ff;--chip:#111;--chipfg:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0e0e12;--fg:#f4f4f6;--mut:#9a9aa6;--card:#1b1b22;--line:#2b2b35;--acc:#4d8dff;--chip:#24242e}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:center;gap:20px;padding:14px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}
.search{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:24px;padding:10px 16px}
.search input{border:0;background:none;outline:0;flex:1;min-width:0}
.btn{border:0;border-radius:20px;padding:9px 18px;background:var(--acc);color:#fff;font-weight:600}
.btn.ghost{background:var(--card);color:var(--fg)}
.btn.danger{background:#e5484d}
main{padding:22px 28px 60px;max-width:1400px;margin:auto}
h1{font-size:clamp(34px,6vw,64px);letter-spacing:-2px;line-height:1;font-weight:800}
.sub{color:var(--mut);margin:10px 0 22px;max-width:60ch}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px}
.chip{border:0;border-radius:10px;padding:14px 22px;background:var(--chip);color:var(--chipfg);font-weight:600;white-space:nowrap;opacity:.65;transition:opacity .2s,transform .2s}
.chip.on{opacity:1;box-shadow:0 0 0 2px var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{cursor:pointer;position:relative}
.media{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--card)}
.media>img,.media>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .media>*{transform:scale(1.05)}
.art{position:absolute;inset:0;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 90% 55%),hsl(calc(var(--h) + 70) 85% 42%));transition:transform .5s}
.art i{position:absolute;border-radius:50%;filter:blur(22px);background:hsl(calc(var(--h) + 140) 100% 70%/.75);animation:fl 6s ease-in-out infinite alternate}
.art i:nth-child(1){width:55%;height:55%;left:-8%;top:-10%}
.art i:nth-child(2){width:45%;height:45%;right:-6%;bottom:-8%;animation-delay:-2s;background:hsl(calc(var(--h) + 40) 100% 65%/.8)}
.art i:nth-child(3){width:30%;height:30%;left:40%;top:30%;animation-delay:-4s;background:hsl(var(--h) 100% 85%/.6)}
.art b{position:absolute;inset:0;display:grid;place-items:center;font-size:72px;animation:bob 3.2s ease-in-out infinite}
@keyframes fl{to{transform:translate(40%,30%) scale(1.3)}}
@keyframes bob{50%{transform:translateY(-10px) rotate(-6deg) scale(1.08)}}
@media(prefers-reduced-motion:reduce){.art i,.art b{animation:none}}
.edit{position:absolute;top:10px;right:10px;border:0;border-radius:50%;width:34px;height:34px;background:#000a;color:#fff;opacity:0;transition:opacity .2s;z-index:2}
.card:hover .edit,.edit:focus-visible{opacity:1}
@media(hover:none){.edit{opacity:1}}
.meta{display:flex;justify-content:space-between;gap:8px;margin-top:9px;font-weight:600}
.meta small{color:var(--mut);font-weight:400}
.cat{color:var(--mut);font-size:13px}
.add .media{display:grid;place-items:center;background:none;border:2px dashed var(--line);font-size:42px;color:var(--mut)}
.empty{color:var(--mut);padding:40px 0}
.ov{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:16px;z-index:20}
.ov.open{display:grid}
.panel{background:var(--bg);border-radius:14px;width:min(520px,100%);max-height:92vh;overflow:auto;padding:22px;animation:pop .18s}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.ph h2{font-size:20px}
.x{border:0;background:var(--card);border-radius:50%;width:34px;height:34px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
textarea.in{min-height:240px;resize:vertical}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.todo{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.todo.done span{text-decoration:line-through;color:var(--mut)}
.todo span{flex:1}
.big{font-size:64px;font-weight:800;letter-spacing:-2px;text-align:center;margin:14px 0;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.keys button{border:0;border-radius:10px;padding:14px;background:var(--card);font-size:18px}
.keys .op{background:var(--acc);color:#fff}
.sw{display:flex;gap:8px;margin-top:12px}
.sw button{flex:1;height:70px;border:0;border-radius:10px;font-size:12px;color:#fff;text-shadow:0 0 4px #000}
.hint{color:var(--mut);font-size:13px;margin-top:10px}
@media(max-width:600px){header{padding:12px 16px;gap:10px}.logo{font-size:18px}main{padding:18px 16px 50px}#addTop{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">One For All</div>
  <div class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="Cari tool…" aria-label="Cari tool"></div>
  <button class="btn" id="addTop">+ Tambah tool</button>
</header>
<main>
  <h1>One For All</h1>
  <p class="sub">Semua tool favoritmu dalam satu dashboard. Ganti tampilan tiap kartu dengan foto atau video pendek lewat tombol ✎.</p>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>
<div class="ov" id="ov"><div class="panel" role="dialog" aria-modal="true"><div class="ph"><h2 id="pt"></h2><button class="x" id="px" aria-label="Tutup">✕</button></div><div id="pb"></div></div></div>

<script>
/* ====== KONFIGURASI ======
   media: isi dengan path gambar/video di repo, contoh "media/catatan.mp4" atau "media/catatan.jpg".
   Kosongkan untuk memakai animasi bawaan. Bisa juga diganti lewat tombol ✎ di tiap kartu. */
const TOOLS=[
 {id:'notes',t:'Catatan Cepat',c:'Produktivitas',e:'📝',h:210,media:''},
 {id:'todo',t:'Daftar Tugas',c:'Produktivitas',e:'✅',h:150,media:''},
 {id:'pomo',t:'Timer Fokus',c:'Produktivitas',e:'⏱️',h:12,media:''},
 {id:'calc',t:'Kalkulator',c:'Utilitas',e:'🧮',h:265,media:''},
 {id:'pass',t:'Generator Password',c:'Utilitas',e:'🔐',h:320,media:''},
 {id:'color',t:'Palet Warna',c:'Kreatif',e:'🎨',h:330,media:''}
];

const $=s=>document.querySelector(s);
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const idb={open(){return new Promise(r=>{try{const q=indexedDB.open('ofa',1);q.onupgradeneeded=()=>q.result.createObjectStore('m');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})},
 async op(m,...a){const d=await this.open();if(!d)return null;return new Promise(r=>{try{const q=d.transaction('m',m==='get'?'readonly':'readwrite').objectStore('m')[m](...a);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})}};

let meta=ls.get('ofa_meta',{}),custom=ls.get('ofa_custom',[]),opens=ls.get('ofa_open',{}),cat='Semua',cleanup=null;
const all=()=>[...TOOLS,...custom.map(c=>({...c,e:'🔗',h:(c.id.length*47)%360,custom:1}))];
const view=t=>({...t,...(meta[t.id]||{})});
const isVid=(u,t)=>(t||'').startsWith('video')||/\.(mp4|webm|mov|m4v)(\?|$)/i.test(u||'');

async function render(){
 const list=all().map(view),cats=['Semua',...new Set(list.map(t=>t.c))],q=$('#q').value.toLowerCase();
 $('#chips').innerHTML=cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('');
 const shown=list.filter(t=>(cat==='Semua'||t.c===cat)&&t.t.toLowerCase().includes(q));
 const cards=await Promise.all(shown.map(async t=>{
  const blob=await idb.op('get',t.id);let src=t.mediaUrl||t.media,type='';
  if(blob){src=URL.createObjectURL(blob);type=blob.type}
  const m=src?(isVid(src,type)?`<video src="${src}" autoplay loop muted playsinline></video>`:`<img src="${src}" alt="${t.t}">`)
   :`<div class="art" style="--h:${t.h}"><i></i><i></i><i></i><b>${t.e}</b></div>`;
  return `<article class="card" data-id="${t.id}"><div class="media">${m}<button class="edit" data-edit="${t.id}" aria-label="Ubah ${t.t}">✎</button></div>
  <div class="meta"><span>${t.t}<br><span class="cat">${t.c}</span></span><small>▶ ${opens[t.id]||0}</small></div></article>`}));
 $('#grid').innerHTML=cards.join('')+`<article class="card add" data-add="1"><div class="media">+</div><div class="meta"><span>Tambah tool baru</span></div></article>`;
}

function openModal(title,html){$('#pt').textContent=title;$('#pb').innerHTML=html;$('#ov').classList.add('open')}
function close(){$('#ov').classList.remove('open');if(cleanup){cleanup();cleanup=null}$('#pb').innerHTML=''}
$('#px').onclick=close;$('#ov').onclick=e=>{if(e.target.id==='ov')close()};
addEventListener('keydown',e=>{if(e.key==='Escape')close()});
$('#q').oninput=render;
$('#addTop').onclick=()=>editor(null);
$('#chips').onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;render()}};
$('#grid').onclick=e=>{
 const ed=e.target.closest('[data-edit]');if(ed){e.stopPropagation();return editor(ed.dataset.edit)}
 if(e.target.closest('[data-add]'))return editor(null);
 const card=e.target.closest('[data-id]');if(!card)return;
 const t=view(all().find(x=>x.id===card.dataset.id));
 opens[t.id]=(opens[t.id]||0)+1;ls.set('ofa_open',opens);
 if(t.custom){window.open(t.url,'_blank','noopener');render();return}
 openModal(t.t,'<div id="app"></div>');APPS[t.id]($('#app'));render();
};

/* ====== EDITOR KARTU ====== */
function editor(id){
 const base=id?all().find(x=>x.id===id):null,t=base?view(base):{t:'',c:'Link Saya',url:'',mediaUrl:''};
 openModal(id?'Ubah kartu':'Tambah tool',`
 <label>Judul</label><input class="in" id="f_t" value="${(t.t||'').replace(/"/g,'&quot;')}">
 ${!id||t.custom?`<label>Kategori</label><input class="in" id="f_c" value="${t.c||''}"><label>Link tool (https://…)</label><input class="in" id="f_u" value="${t.url||''}" placeholder="https://">`:''}
 <label>Gambar atau video pendek dari perangkat</label><input class="in" id="f_f" type="file" accept="image/*,video/*">
 <label>Atau path / URL media (mis. media/video.mp4)</label><input class="in" id="f_m" value="${t.mediaUrl||''}" placeholder="media/foto.jpg">
 <p class="hint">Media yang diunggah tersimpan di browser ini saja. Untuk tampilan permanen di GitHub, taruh file di repo dan isi field media pada kode.</p>
 <div class="row"><button class="btn" id="save">Simpan</button><button class="btn ghost" id="rm">Hapus media</button>${t.custom?'<button class="btn danger" id="del">Hapus tool</button>':''}</div>`);
 $('#save').onclick=async()=>{
  const nid=id||'c'+Date.now(),file=$('#f_f').files[0],m=meta[nid]||{};
  m.t=$('#f_t').value.trim()||'Tanpa judul';m.mediaUrl=$('#f_m').value.trim();
  if(!id){custom.push({id:nid,t:m.t,c:$('#f_c').value.trim()||'Link Saya',url:$('#f_u').value.trim()});ls.set('ofa_custom',custom)}
  else if(t.custom){const c=custom.find(x=>x.id===id);c.c=$('#f_c').value.trim()||c.c;c.url=$('#f_u').value.trim();ls.set('ofa_custom',custom)}
  if(file){await idb.op('put',file,nid);m.mediaUrl=''}
  meta[nid]=m;ls.set('ofa_meta',meta);close();render();
 };
 $('#rm').onclick=async()=>{await idb.op('delete',id);if(id&&meta[id])delete meta[id].mediaUrl;ls.set('ofa_meta',meta);close();render()};
 if($('#del'))$('#del').onclick=async()=>{custom=custom.filter(x=>x.id!==id);ls.set('ofa_custom',custom);await idb.op('delete',id);close();render()};
}

/* ====== TOOL BAWAAN ====== */
const APPS={
 notes(el){
  el.innerHTML='<textarea class="in" id="n" placeholder="Tulis apa saja. Tersimpan otomatis."></textarea>';
  const n=$('#n');n.value=ls.get('ofa_notes','');n.oninput=()=>ls.set('ofa_notes',n.value);n.focus();
 },
 todo(el){
  let items=ls.get('ofa_todo',[]);
  el.innerHTML='<div class="row" style="margin:0 0 8px"><input class="in" id="ti" placeholder="Tugas baru, lalu Enter" style="flex:1"><button class="btn" id="ta">Tambah</button></div><div id="tl"></div>';
  const draw=()=>{ls.set('ofa_todo',items);$('#tl').innerHTML=items.length?items.map((x,i)=>`<div class="todo ${x.d?'done':''}"><input type="checkbox" data-i="${i}" ${x.d?'checked':''}><span></span><button class="x" data-r="${i}" aria-label="Hapus">✕</button></div>`).join(''):'<p class="empty">Belum ada tugas. Tambahkan yang pertama.</p>';
   $('#tl').querySelectorAll('.todo span').forEach((s,i)=>s.textContent=items[i].t)};
  const add=()=>{const v=$('#ti').value.trim();if(v){items.push({t:v,d:0});$('#ti').value='';draw()}};
  $('#ta').onclick=add;$('#ti').onkeydown=e=>{if(e.key==='Enter')add()};
  $('#tl').onclick=e=>{const d=e.target.dataset;if(d.i!==undefined){items[d.i].d=e.target.checked?1:0;draw()}if(d.r!==undefined){items.splice(d.r,1);draw()}};draw();
 },
 pomo(el){
  let mode=25*60,left=mode,iv=null;
  el.innerHTML='<div class="row" style="margin:0;justify-content:center"><button class="btn ghost" data-m="25">Fokus 25</button><button class="btn ghost" data-m="5">Istirahat 5</button></div><div class="big" id="tm"></div><div class="row" style="justify-content:center"><button class="btn" id="go">Mulai</button><button class="btn ghost" id="rs">Ulangi</button></div>';
  const show=()=>{$('#tm').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')};
  const stop=()=>{clearInterval(iv);iv=null;$('#go').textContent='Mulai'};
  $('#go').onclick=()=>{if(iv)return stop();$('#go').textContent='Jeda';iv=setInterval(()=>{left--;show();if(left<=0){stop();document.title='Selesai! — One For All'}},1000)};
  $('#rs').onclick=()=>{stop();left=mode;show()};
  el.onclick=e=>{const m=e.target.dataset.m;if(m){stop();mode=left=m*60;show()}};
  cleanup=()=>{clearInterval(iv);document.title='One For All'};show();
 },
 calc(el){
  el.innerHTML='<input class="in" id="cd" style="font-size:26px;text-align:right" placeholder="0" inputmode="decimal"><div class="keys" id="ck"></div>';
  const ks=['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='],d=$('#cd');
  $('#ck').innerHTML=ks.map(k=>`<button class="${'÷×−+='.includes(k)?'op':''}">${k}</button>`).join('');
  const run=()=>{const s=d.value.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-');
   if(!/^[0-9+\-*/().\s]+$/.test(s))return d.value='Format salah';
   try{const r=Function('"use strict";return ('+s+')')();d.value=Number.isFinite(r)?+r.toFixed(10):'Tidak valid'}catch(e){d.value='Format salah'}};
  $('#ck').onclick=e=>{const k=e.target.textContent;if(e.target.tagName!=='BUTTON')return;
   if(k==='C')d.value='';else if(k==='⌫')d.value=d.value.slice(0,-1);else if(k==='=')run();else d.value+=k};
  d.onkeydown=e=>{if(e.key==='Enter')run()};
 },
 pass(el){
  el.innerHTML='<input class="in" id="pw" readonly style="font:600 20px monospace"><label>Panjang: <b id="pl">16</b></label><input type="range" id="pr" min="8" max="48" value="16" style="width:100%"><label><input type="checkbox" id="ps" checked> Sertakan simbol</label><div class="row"><button class="btn" id="pg">Buat baru</button><button class="btn ghost" id="pc">Salin</button></div>';
  const gen=()=>{const n=+$('#pr').value,cs='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'+($('#ps').checked?'!@#$%^&*?-_':''),a=new Uint32Array(n);
   crypto.getRandomValues(a);$('#pl').textContent=n;$('#pw').value=[...a].map(x=>cs[x%cs.length]).join('')};
  $('#pr').oninput=gen;$('#ps').onchange=gen;$('#pg').onclick=gen;
  $('#pc').onclick=async()=>{try{await navigator.clipboard.writeText($('#pw').value);$('#pc').textContent='Tersalin'}catch(e){$('#pw').select()}};gen();
 },
 color(el){
  el.innerHTML='<input type="color" id="cp" value="#0057ff" style="width:100%;height:90px;border:0;background:none"><p class="hint" id="cv"></p><div class="sw" id="sw"></div><p class="hint">Klik warna untuk menyalin kodenya.</p>';
  const hsl=h=>{const f=(n,k=(n+h/30)%12)=>.5-.5*Math.max(-1,Math.min(k-3,9-k,1));return[f(0),f(8),f(4)].map(v=>Math.round(v*255))};
  const hex=a=>'#'+a.map(v=>v.toString(16).padStart(2,'0')).join('');
  const upd=()=>{const c=$('#cp').value,r=[1,3,5].map(i=>parseInt(c.substr(i,2),16));
   $('#cv').textContent=c.toUpperCase()+'  ·  rgb('+r.join(', ')+')';
   const mx=Math.max(...r),mn=Math.min(...r);let h=0;if(mx!==mn){const d=mx-mn;h=mx===r[0]?((r[1]-r[2])/d)%6:mx===r[1]?(r[2]-r[0])/d+2:(r[0]-r[1])/d+4;h=(h*60+360)%360}
   $('#sw').innerHTML=[0,30,150,180,210].map(s=>{const x=hex(hsl((h+s)%360));return`<button style="background:${x}" data-x="${x}">${x}</button>`}).join('')};
  $('#cp').oninput=upd;$('#sw').onclick=e=>{const x=e.target.dataset.x;if(x)navigator.clipboard&&navigator.clipboard.writeText(x).catch(()=>{})};upd();
 }
};
render();
</script>
</body>
</html>
